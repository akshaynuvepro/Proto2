_base_: ../_base_/default.yaml

model:
  backend: openai_chat
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: medium

train:
  batch_size: 4
  accumulation: 1
  num_epochs: 4
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 4
  failure_only: false

optimizer:
  learning_rate: 4

evaluation:
  use_gate: true
  sel_env_num: 4
  test_env_num: 0
  eval_test: false

env:
  name: assessment_improver
  skill_init: doc/templates/assessment-skill-improver/SKILL.md
  split_mode: split_dir
  split_dir: fixtures/assessment_improver
  workers: 1
  max_completion_tokens: 8192
  limit: 0
