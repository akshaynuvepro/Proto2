[project]
name = "skill-lab"
version = "0.1.0"
description = "Chainlit assessment skill lab: 20 assessments → skill → generate → compare → improve"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "chainlit>=2.0.0",
    "sacrebleu>=2.5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["openrouter", "app"]

[tool.setuptools.packages.find]
include = ["skill_lab*"]
